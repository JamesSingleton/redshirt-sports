packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  bufferutil: false
  core-js: false
  esbuild: true
  utf-8-validate: false

catalog:
  "@clerk/nextjs": ^7.10.0
  "@sanity/client": ^8.17.0
  "@sentry/nextjs": ^11.16.0
  "@testing-library/jest-dom": "^8.0.0"
  "@testing-library/react": "^16.3.3"
  "@testing-library/user-event": ^14.6.13
  "@types/node": ^26.6.6
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": ^6.3.0
  drizzle-kit: "^0.31.11"
  drizzle-orm: ^0.45.4
  lucide-react: ^1.77.0
  next: ^16.4.6
  next-sanity: ^13.5.1
  next-themes: "^0.4.6"
  posthog-js: ^1.450.0
  posthog-node: ^6.0.5
  react: ^19.3.1
  react-dom: ^19.3.1
  sanity: ^6.24.0
  tailwindcss: ^4.3.5
  typescript: "^7.0.2"
  vite: ^8.3.8
  vitest: ^5.1.1
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.14"
  - "@ui-sdk/react@0.1.0-beta.14"

permissions:
  '@ui-sdk/core':
    skills: false
